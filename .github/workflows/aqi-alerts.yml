name: OXYZEN AQI email alerts
# Scheduled background checks run independently of dashboard sessions.

on:
  push:
    branches:
      - main
      - feature/current-location-aqi-alerts
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxyzen-aqi-alert-monitor
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist motor requests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/test_waqi_data.py tests/test_alert_worker.py -q

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check motor requests

      - name: Check opted-in users and send transition emails
        working-directory: backend
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          # Free Gmail SMTP sender (requires a Google App Password, not the account password).
          EMAIL_PROVIDER: gmail
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: OxyZen AQI Monitor
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          AQI_ALERT_POLL_SECONDS: "300"
        run: python alert_worker.py
